name: Push a tag (Check & Deploy)

on:
  push:
    tags:
      - "v[0-9]+\\.[0-9]+\\.[0-9]+" # stable
      - "v[0-9]+\\.[0-9]+\\.[0-9]+-rc\\.[0-9]+" # release candidate (e.g. v1.2.0-rc.1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/check.yaml

  build_and_deploy_app_builder:
    needs: check
    permissions:
      contents: read
      actions: read
      id-token: write # needed for using open id token to authenticate with GCP
    uses: ./.github/workflows/build_and_deploy.yaml
    with:
      gcloud-service: marble-frontend
      dockerfile: ./Dockerfile
      dockerfile-target-stage: app-builder
      environment: production
      version: ${{ github.ref_name }}
      SENTRY_RELEASE: ${{ github.ref_name }}
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SEGMENT_WRITE_KEY_OPENSOURCE: ${{ secrets.SEGMENT_WRITE_KEY_OPENSOURCE }}

  build_and_deploy_backoffice:
    needs: check
    permissions:
      contents: read
      actions: read
      id-token: write # needed for using open id token to authenticate with GCP
    uses: ./.github/workflows/build_and_deploy.yaml
    with:
      gcloud-service: marble-backoffice
      dockerfile: ./Dockerfile.backoffice
      dockerfile-target-stage: backoffice
      environment: production
      version: ${{ github.ref_name }}
      SENTRY_RELEASE: ${{ github.ref_name }}
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SEGMENT_WRITE_KEY_OPENSOURCE: ${{ secrets.SEGMENT_WRITE_KEY_OPENSOURCE }}
