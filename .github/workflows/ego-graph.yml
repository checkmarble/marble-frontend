name: ego-graph CI

on:
  push:
    branches: [main]
    paths:
      - "packages/ego-graph/**"
      - ".github/workflows/ego-graph.yml"
  pull_request:
    paths:
      - "packages/ego-graph/**"
      - ".github/workflows/ego-graph.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".tool-versions"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run -F ego-graph type-check

      - name: Test
        run: bun run -F ego-graph unit-tests

      - name: Lint
        run: bun run -F ego-graph lint

      - name: Build
        run: bun run -F ego-graph build

      - name: Check package
        run: bun run -F ego-graph check-package
