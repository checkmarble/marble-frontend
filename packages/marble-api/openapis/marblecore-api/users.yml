/me/organizations:
  get:
    tags:
      - Users
      - Organizations
    summary: List the current user's organizations
    operationId: listMyOrganizations
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Organizations the current user belongs to
        content:
          application/json:
            schema:
              type: object
              required:
                - organizations
              properties:
                organizations:
                  type: array
                  items:
                    $ref: "#/components/schemas/UserOrganizationDto"
      "401":
        $ref: "components.yml#/responses/401"

/settings/me/unavailable:
  get:
    tags:
      - Personal settings
    summary: Get the current unavailability
    operationId: getUnavailability
    security:
      - bearerAuth: []
    responses:
      "200":
        description: End date of the current unavailability
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalSettingsUnavailableDto"
      "401":
        $ref: "components.yml#/responses/401"
      "403":
        $ref: "components.yml#/responses/403"
      "404":
        description: The user has no current unavailability
  post:
    tags:
      - Personal settings
    summary: Set a user as unavailable until a date
    operationId: setUnavailability
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PersonalSettingsUnavailableDto"
    responses:
      "204":
        description: Unavailability recorded
      "401":
        $ref: "components.yml#/responses/401"
      "403":
        $ref: "components.yml#/responses/403"
  delete:
    tags:
      - Personal settings
    summary: Cancel the current or planned unavailability
    operationId: cancelUnavailability
    security:
      - bearerAuth: []
    responses:
      "204":
        description: Unavailability cancelled
      "401":
        $ref: "components.yml#/responses/401"
      "403":
        $ref: "components.yml#/responses/403"

components:
  schemas:
    OrganizationEnvironmentDto:
      type: string
      enum: [production, staging, demo]
    UserOrganizationDto:
      type: object
      required:
        - id
        - name
        - roles
        - environment
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        environment:
          $ref: "#/components/schemas/OrganizationEnvironmentDto"
    PersonalSettingsUnavailableDto:
      type: object
      required:
        - until
      properties:
        until:
          type: string
          format: date
