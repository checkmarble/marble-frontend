/tenants/{tenantId}/oidc-configuration:
  parameters:
    - $ref: '#/components/parameters/TenantId'
  get:
    tags: [Admin]
    summary: Get a tenant OIDC configuration
    description: Requires the TENANT_OIDC_CONFIG_UPDATE permission on the tenant (tenant admins, OIDC_CONFIG_EDITOR API keys, Marble admins). Returns 404 when the tenant has no configuration. Available when tenant OIDC is configured.
    operationId: getTenantOidcConfiguration
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Tenant OIDC configuration without the client secret
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantOidcConfiguration'
      '400':
        $ref: 'components.yml#/responses/400'
      '401':
        $ref: 'components.yml#/responses/401'
      '403':
        $ref: 'components.yml#/responses/403'
      '404':
        $ref: 'components.yml#/responses/404'
  put:
    tags: [Admin]
    summary: Save a tenant OIDC configuration
    description: >-
      Full replace: omitted fields are reset to their defaults (sso_enabled to true), except client_secret which is kept. Requires the TENANT_OIDC_CONFIG_UPDATE permission on the tenant (tenant admins, OIDC_CONFIG_EDITOR API keys, Marble admins).
      Returns 403 without an SSO license. Available when tenant OIDC is configured.
    operationId: putTenantOidcConfiguration
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantOidcConfigurationInput'
    responses:
      '204':
        description: Configuration saved
      '400':
        $ref: 'components.yml#/responses/400'
      '401':
        $ref: 'components.yml#/responses/401'
      '403':
        $ref: 'components.yml#/responses/403'
      '404':
        $ref: 'components.yml#/responses/404'
  delete:
    tags: [Admin]
    summary: Delete a tenant OIDC configuration
    description: >-
      Destroys the stored client secret; domains are kept. Returns 204 even when nothing was configured.
      Requires the TENANT_OIDC_CONFIG_UPDATE permission on the tenant (tenant admins, OIDC_CONFIG_EDITOR API keys, Marble admins). Available when tenant OIDC is configured.
    operationId: deleteTenantOidcConfiguration
    security:
      - bearerAuth: []
    responses:
      '204':
        description: Configuration deleted
      '400':
        $ref: 'components.yml#/responses/400'
      '401':
        $ref: 'components.yml#/responses/401'
      '403':
        $ref: 'components.yml#/responses/403'
      '404':
        $ref: 'components.yml#/responses/404'
/tenants/{tenantId}/domains:
  parameters:
    - $ref: '#/components/parameters/TenantId'
  get:
    tags: [Admin]
    summary: List a tenant's OIDC domains
    description: Ordered by domain. Requires the TENANT_OIDC_CONFIG_UPDATE permission on the tenant (tenant admins, OIDC_CONFIG_EDITOR API keys, Marble admins). Available when tenant OIDC is configured.
    operationId: listTenantOidcDomains
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Tenant domains
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TenantDomain'
      '400':
        $ref: 'components.yml#/responses/400'
      '401':
        $ref: 'components.yml#/responses/401'
      '403':
        $ref: 'components.yml#/responses/403'
  post:
    tags: [Admin]
    summary: Add a tenant OIDC domain
    description: >-
      Requires the TENANT_OIDC_CONFIG_UPDATE permission on the tenant (tenant admins, OIDC_CONFIG_EDITOR API keys, Marble admins). Creating a domain already verified is reserved to Marble admins.
      Returns 409 when the tenant already lists the domain, or when the domain is created verified
      and another tenant already has it verified. Available when tenant OIDC is configured.
    operationId: createTenantOidcDomain
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [domain]
            properties:
              domain:
                type: string
              verified:
                type: boolean
                default: false
                description: Create the domain already verified. Marble admins only (403 otherwise).
    responses:
      '201':
        description: Created domain
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantDomain'
      '400':
        $ref: 'components.yml#/responses/400'
      '401':
        $ref: 'components.yml#/responses/401'
      '403':
        $ref: 'components.yml#/responses/403'
      '404':
        $ref: 'components.yml#/responses/404'
      '409':
        $ref: 'components.yml#/responses/409'
/tenants/{tenantId}/domains/{domainId}:
  parameters:
    - $ref: '#/components/parameters/TenantId'
    - name: domainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  patch:
    tags: [Admin]
    summary: Verify or unverify a tenant OIDC domain
    description: >-
      Marble admins only. Verifying is idempotent (keeps the first verification date); unverifying
      makes the domain pending again. Returns 404 when the domain does not belong to the tenant and
      409 when another tenant already has the domain verified. Available when tenant OIDC is configured.
    operationId: updateTenantOidcDomain
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [verified]
            properties:
              verified:
                type: boolean
    responses:
      '204':
        description: Domain updated
      '400':
        $ref: 'components.yml#/responses/400'
      '401':
        $ref: 'components.yml#/responses/401'
      '403':
        $ref: 'components.yml#/responses/403'
      '404':
        $ref: 'components.yml#/responses/404'
      '409':
        $ref: 'components.yml#/responses/409'
  delete:
    tags: [Admin]
    summary: Delete a tenant OIDC domain
    description: Marble admins only. Returns 204 even when nothing matched. Available when tenant OIDC is configured.
    operationId: deleteTenantOidcDomain
    security:
      - bearerAuth: []
    responses:
      '204':
        description: Domain deleted
      '400':
        $ref: 'components.yml#/responses/400'
      '401':
        $ref: 'components.yml#/responses/401'
      '403':
        $ref: 'components.yml#/responses/403'
      '404':
        $ref: 'components.yml#/responses/404'
components:
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    TenantOidcConfigurationInput:
      type: object
      required: [issuer, client_id]
      properties:
        issuer:
          type: string
          format: uri
        client_id:
          type: string
        client_secret:
          type: string
          nullable: true
          description: Required for a new configuration; omit or pass null to retain the existing secret.
        scopes:
          type: array
          description: Defaults to openid, profile and email when omitted or empty.
          items:
            type: string
        extra_params:
          type: object
          nullable: true
          additionalProperties:
            type: string
        email_claim:
          type: string
        sso_enabled:
          type: boolean
          default: true
    TenantOidcConfiguration:
      type: object
      required: [tenant_id, issuer, client_id, client_secret_set, scopes, extra_params, email_claim, sso_enabled]
      properties:
        tenant_id:
          type: string
          format: uuid
        issuer:
          type: string
        client_id:
          type: string
        client_secret_set:
          type: boolean
        scopes:
          type: array
          items:
            type: string
        extra_params:
          type: object
          nullable: true
          additionalProperties:
            type: string
        email_claim:
          type: string
        sso_enabled:
          type: boolean
    TenantDomain:
      type: object
      required: [id, tenant_id, domain, verified_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        domain:
          type: string
        verified_at:
          type: string
          format: date-time
          nullable: true
          description: Null while the domain is pending verification.
        created_at:
          type: string
          format: date-time
